name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Typecheck (tsc --noEmit)
      - run: npm run lint

      # Unit tests only; `npm test` excludes e2e/. Playwright e2e needs the backend and is not run in CI.
      - run: npm test

      - run: npm run build
